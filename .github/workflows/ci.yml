name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_exe:
        description: "Commit the tested Windows exe to release/windows-x64 on this branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Test + render smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build GUI
        working-directory: gui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --release
      - name: Script reference is up to date
        run: |
          cargo run --release -q -- docs > docs/REFERENCE.md
          git diff --exit-code docs/REFERENCE.md || (echo "::error::docs/REFERENCE.md is stale; run 'moodcut docs > docs/REFERENCE.md'" && exit 1)
      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Render an example end to end
        run: |
          mc=target/release/moodcut
          $mc doctor || true
          $mc run smoke.mcut @examples/motion-graphics.mcs --create 1920x1080@30
          $mc frame smoke.mcut -t 1.5 -o smoke.png
          $mc render smoke.mcut --preset draft --range 0-3 --scale 0.5 -o smoke.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact smoke.mp4
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 smoke.mp4 | cut -d. -f1)" -ge 2
      - name: Quality check passes on the example
        run: target/release/moodcut check smoke.mcut --strict
      - name: Interchange and caption exports
        run: |
          mc=target/release/moodcut
          $mc run smoke.mcut "marker add 0 'Intro'"
          $mc render smoke.mcut -p xml -o smoke.xml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('smoke.xml')"
          $mc render smoke.mcut -p edl -o smoke.edl && head -3 smoke.edl
          $mc render smoke.mcut -p chapters -o chapters.txt && grep -q "0:00 Intro" chapters.txt
      - name: HTML motion graphic renders (headless Chrome)
        run: |
          target/release/moodcut graphic examples/graphics/kinetic-title.html -o title.mov --dur 2 --size 1280x720 --var title="CI TEST" --var sub=ok
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 title.mov)" -eq 60
      - name: AI apps get connected and disconnected (fake home)
        run: |
          home="$RUNNER_TEMP/aihome"; mkdir -p "$home/.cursor" "$home/.config/Claude"
          echo '{"mcpServers": {"other": {"command": "x"}},}' > "$home/.config/Claude/claude_desktop_config.json"
          HOME="$home" target/release/moodcut install-ai
          grep -q '"other"' "$home/.config/Claude/claude_desktop_config.json"
          grep -q '"moodcut"' "$home/.cursor/mcp.json"
          HOME="$home" target/release/moodcut uninstall-ai
          ! grep -q '"moodcut"' "$home/.cursor/mcp.json"
      - name: Uninstall cleans every profile that was connected (as the Windows uninstaller does)
        run: |
          shared="$RUNNER_TEMP/ai-profiles"; alice="$RUNNER_TEMP/alice"; bob="$RUNNER_TEMP/bob"; admin="$RUNNER_TEMP/admin"
          mkdir -p "$alice/.cursor" "$bob/.cursor" "$admin/.cursor"
          HOME="$alice" MOODCUT_AI_PROFILES="$shared" target/release/moodcut install-ai cursor
          HOME="$bob" MOODCUT_AI_PROFILES="$shared" target/release/moodcut install-ai cursor
          # bob has since switched to another copy of MoodCut: that entry must stay
          echo '{"mcpServers": {"moodcut": {"command": "/elsewhere/moodcut", "args": ["mcp"]}}}' > "$bob/.cursor/mcp.json"
          test "$(ls "$shared"/*.json | wc -l)" -eq 2
          HOME="$admin" MOODCUT_AI_PROFILES="$shared" target/release/moodcut uninstall-ai --all-profiles
          ! grep -q '"moodcut"' "$alice/.cursor/mcp.json"
          grep -q '/elsewhere/moodcut' "$bob/.cursor/mcp.json"
          test ! -e "$shared"
      - name: Package the Linux build
        run: tar -czf moodcut-linux-x64.tar.gz -C target/release moodcut && ls -l moodcut-linux-x64.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: moodcut-linux-x64
          path: moodcut-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build GUI
        working-directory: gui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Smoke test
        shell: pwsh
        run: |
          .\target\release\moodcut.exe --version
          .\target\release\moodcut.exe run smoke.mcut "@examples/motion-graphics.mcs" --create 1280x720@30
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\target\release\moodcut.exe frame smoke.mcut -t 5 -o smoke.png
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.png)) { exit 1 }
      - name: HTML motion graphic still renders (headless Edge)
        shell: pwsh
        run: |
          .\target\release\moodcut.exe graphic examples\graphics\lower-third.html -o lt.png --dur 0 --size 1280x720 --at 2 --var name=CI --var role=Windows
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path lt.png)) { exit 1 }
      - name: Exe has its icon and version info
        shell: pwsh
        run: |
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\target\release\moodcut.exe")
          $v | Format-List ProductName, FileDescription, ProductVersion, FileVersion
          if ($v.ProductName -ne "MoodCut") { exit 1 }
      - name: First run on a clean PC - portable FFmpeg, then a full render
        shell: pwsh
        env:
          MOODCUT_HOME: ${{ runner.temp }}\moodcut-home
        run: |
          $mc = ".\target\release\moodcut.exe"
          & $mc setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $mc render smoke.mcut --preset draft --range 0-3 --scale 0.5 -o smoke.mp4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.mp4)) { exit 1 }
          & $mc check smoke.mcut --strict
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # informational: which AV1 encoder the default portable build offers
          & $mc render smoke.mcut -p av1 --range 0-1 --scale 0.25 -o smoke_av1.mp4
          Write-Host "av1 preset exit code: $LASTEXITCODE"
          & $mc render smoke.mcut -p xml -o smoke.xml
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | Format-List; exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$version" installer\moodcut.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\MoodCut-Setup-x64.exe | Format-List Name, Length
      - name: Installer installs, sets everything up and uninstalls cleanly
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "MoodCut Test"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process dist\MoodCut-Setup-x64.exe -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/TASKS=addtopath,assoc,ffmpeg,connectai", "/LOG=`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; exit 1 }
          if (-not (Test-Path "$dir\moodcut.exe")) { Get-Content $log -Tail 80; Write-Error "moodcut.exe missing"; exit 1 }
          if (-not (Test-Path "$dir\ffmpeg\bin\ffmpeg.exe")) { Get-Content $log -Tail 80; Write-Error "FFmpeg was not installed"; exit 1 }
          & "$dir\moodcut.exe" doctor
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$dir*") { Write-Error "PATH was not updated"; exit 1 }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\MoodCut.Project\shell\open\command").'(default)'
          Write-Host "open command: $cmd"
          if ($cmd -notlike "*moodcut.exe*gui*") { Write-Error "file association missing"; exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait
          # the uninstaller finishes from a temporary copy of itself
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\moodcut.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\moodcut.exe") { Write-Error "moodcut.exe left behind"; exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*$dir*") { Write-Error "PATH entry left behind"; exit 1 }
          if (Test-Path "HKCU:\Software\Classes\MoodCut.Project") { Write-Error "file association left behind"; exit 1 }
          Write-Host "install + uninstall OK"
      - uses: actions/upload-artifact@v6
        with:
          name: moodcut-windows-x64
          path: |
            target/release/moodcut.exe
            dist/MoodCut-Setup-x64.exe
            README.md
            LICENSE
          if-no-files-found: error

  commit-exe:
    name: Commit the tested exe to the branch
    if: github.event_name == 'workflow_dispatch' && inputs.commit_exe
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v7
        with:
          name: moodcut-windows-x64
          path: artifact
      - name: Commit release/windows-x64 (exe and installer)
        run: |
          mkdir -p release/windows-x64
          cp artifact/target/release/moodcut.exe release/windows-x64/moodcut.exe
          cp artifact/dist/MoodCut-Setup-x64.exe release/windows-x64/MoodCut-Setup-x64.exe
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          {
            echo "MoodCut $version for Windows x64"
            echo "source commit: ${{ github.sha }}"
            echo "built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256: $(sha256sum release/windows-x64/moodcut.exe | cut -d' ' -f1)"
            echo "size: $(stat -c %s release/windows-x64/moodcut.exe) bytes"
            echo "installer sha256: $(sha256sum release/windows-x64/MoodCut-Setup-x64.exe | cut -d' ' -f1)"
            echo "installer size: $(stat -c %s release/windows-x64/MoodCut-Setup-x64.exe) bytes"
          } > release/windows-x64/BUILD.txt
          cat release/windows-x64/BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/windows-x64
          if git diff --cached --quiet; then echo "exe unchanged"; exit 0; fi
          git commit -m "Windows exe $version built and tested by CI from ${GITHUB_SHA::7}"
          git push origin HEAD:${{ github.ref_name }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: moodcut-windows-x64
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: moodcut-linux-x64
          path: linux
      - name: Package
        run: |
          mkdir -p out
          cp dist/dist/MoodCut-Setup-x64.exe out/MoodCut-Setup-x64.exe
          (cd dist && zip -r ../out/moodcut-${{ github.ref_name }}-windows-x64-portable.zip target/release/moodcut.exe README.md LICENSE)
          cp linux/moodcut-linux-x64.tar.gz out/moodcut-linux-x64.tar.gz
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
