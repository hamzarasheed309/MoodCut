<!-- Kinetic title: letters rise in one by one, an underline sweeps, then everything exits at the end.
     Fields: title, sub, and the underline's two colors (edit them in MoodCut's graphic editor, or with --var).
     moodcut graphic examples/graphics/kinetic-title.html --dur 4 --var title="MAKE IT MOVE" -->
<style>
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  h1 { margin: 0; font: 900 13vh/1 Inter; color: #fff; letter-spacing: -0.02em; white-space: nowrap; }
  h1 span { display: inline-block; animation: rise .7s cubic-bezier(.2,.9,.25,1.2) both; }
  .line { height: 1vh; margin-top: 2vh; background: linear-gradient(90deg, {{line_from|#7c5cff}}, {{line_to|#ff3b6b}}); border-radius: 1vh;
          transform-origin: left; animation: sweep .8s .5s cubic-bezier(.7,0,.2,1) both; }
  p { margin: 2vh 0 0; text-align: center; font: 600 3.4vh Inter; color: #ffffffcc; animation: fade .6s .9s both; }
  .all { animation: exit .5s calc(var(--mc-dur) - .6s) cubic-bezier(.6,0,.8,.2) forwards; }
  @keyframes rise { from { transform: translateY(60%) rotate(8deg); opacity: 0 } }
  @keyframes sweep { from { transform: scaleX(0) } }
  @keyframes fade { from { opacity: 0; transform: translateY(30%) } }
  @keyframes exit { to { opacity: 0; transform: scale(1.08); filter: blur(12px) } }
</style>
<div class="wrap"><div class="all">
  <h1 id="t">{{title|Make it move}}</h1>
  <div class="line"></div>
  <p>{{sub|}}</p>
</div></div>
<script type="application/json" id="mc-fields">
{ "title": { "label": "Title" }, "sub": { "label": "Subtitle" }, "line_from": { "label": "Underline start" }, "line_to": { "label": "Underline end" } }
</script>
<script>
  // split the title into letters with a staggered delay (as text, so any title is safe)
  const h = document.getElementById('t');
  const letters = [...h.textContent];
  h.textContent = '';
  letters.forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c === ' ' ? ' ' : c;
    s.style.animationDelay = (i * 0.045).toFixed(3) + 's';
    h.append(s);
  });
</script>
