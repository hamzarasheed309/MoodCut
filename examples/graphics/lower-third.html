<!-- Lower third. Variables: name, role, accent.
     moodcut graphic examples/graphics/lower-third.html --dur 5 --var name="Jane Doe" --var role="Founder" -->
<style>
  :root { --accent: {{accent|#ff3b6b}}; }
  .l3 { position: absolute; left: 6%; bottom: 12%; color: #fff; font-family: Inter; }
  .name { font: 800 4.6vh Inter; letter-spacing: -0.01em; animation: up .6s .1s cubic-bezier(.2,.8,.2,1) both, out .4s 4.4s ease-in forwards; }
  .bar { height: .6vh; width: 100%; margin: .9vh 0; background: var(--accent, #ff3b6b); transform-origin: left;
         animation: grow .7s cubic-bezier(.2,.8,.2,1) both, shrink .4s 4.5s ease-in forwards; }
  .role { font: 500 2.6vh Inter; opacity: .85; animation: up .6s .25s cubic-bezier(.2,.8,.2,1) both, out .4s 4.35s ease-in forwards; }
  @keyframes grow { from { transform: scaleX(0) } }
  @keyframes shrink { to { transform: scaleX(0) } }
  @keyframes up { from { opacity: 0; transform: translateY(40%) } }
  @keyframes out { to { opacity: 0; transform: translateY(-30%) } }
</style>
<div class="l3">
  <div class="name">{{name}}</div>
  <div class="bar"></div>
  <div class="role">{{role}}</div>
</div>
